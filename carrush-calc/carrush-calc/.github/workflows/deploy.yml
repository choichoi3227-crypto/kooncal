name: Deploy to Cloudflare
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: D1·KV 준비 (없으면 자동 생성)
        run: node scripts/provision.mjs
      - run: npm run build
      - name: D1 마이그레이션
        run: npx wrangler d1 migrations apply carrush-db --remote
      - name: 배포
        run: npx wrangler deploy
      - name: 관리자 계정 시크릿 반영
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node -e "require('fs').writeFileSync('/tmp/s.json',JSON.stringify({ADMIN_ID:process.env.ADMIN_ID,ADMIN_PASSWORD:process.env.ADMIN_PASSWORD}))"
          npx wrangler secret bulk /tmp/s.json
          rm /tmp/s.json
