name = "carrush-goon-calc"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"

# D1: 회원, 군표 기록
[[d1_databases]]
binding = "DB"
database_name = "carrush-db"
database_id = "REPLACE_WITH_D1_ID"   # GitHub Actions 가 자동 생성/치환
migrations_dir = "migrations"

# KV: 세션, 점수표 설정
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"            # GitHub Actions 가 자동 생성/치환

# Durable Objects (SQLite-backed): 엘칭방 실시간 군체크
[[durable_objects.bindings]]
name = "ROOM"
class_name = "ClubRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClubRoom"]

[observability]
enabled = true
# R2 미사용
# 관리자 계정(ADMIN_ID / ADMIN_PASSWORD)은 GitHub Secrets → Actions 가 Worker secret 으로 반영
